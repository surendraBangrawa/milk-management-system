server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: ""

scrape_configs:
  # Backend logs
  - job_name: backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend
          service: milk-management
          environment: production
          __path__: /var/log/backend/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp
            service: service

  # Admin logs
  - job_name: admin
    static_configs:
      - targets:
          - localhost
        labels:
          job: admin
          service: milk-management
          environment: production
          __path__: /var/log/admin/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            timestamp: timestamp

  # Website logs
  - job_name: website
    static_configs:
      - targets:
          - localhost
        labels:
          job: website
          service: milk-management
          environment: production
          __path__: /var/log/website/*.log

  # Celery logs
  - job_name: celery
    static_configs:
      - targets:
          - localhost
        labels:
          job: celery
          service: milk-management
          environment: production
          __path__: /var/log/celery/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            task_id: task_id

  # Nginx Proxy Manager logs
  - job_name: nginx-proxy-manager
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-proxy-manager
          service: milk-management
          environment: production
          __path__: /var/log/nginx/*.log
    pipeline_stages:
      - regex:
          expression: '(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<method>\S+) (?P<request_uri>\S+) (?P<protocol>\S+)" (?P<status>\d+) (?P<body_bytes_sent>\d+)'
      - labels:
          method:
          status:

  # Docker container logs
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
        replacement: 'milk-management'

