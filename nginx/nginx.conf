# Nginx configuration for your milk-management-system (admin panel)

# Upstream definition for your Django admin application
# 'admin' here refers to the service name in your docker-compose.yml
# '1002' is the port your gunicorn is binding to inside the admin container
upstream admin_app {
    server admin:1002;
}

# HTTP server block
server {
    # Listen on port 80 for incoming HTTP requests
    listen 80;
    # Server name can be localhost, or your domain if deployed
    server_name localhost;

    # Static files
    # IMPORTANT: The alias path now points to /home/static/ inside the Nginx container,
    # which is where the static_volume_prod is mounted.
    location /static/ {
        alias /home/static/;
        expires 30d;                  # Cache static files for 30 days
        access_log off;               # Don't log access to static files
        log_not_found off;            # Don't log "not found" errors for static files
    }

    # Media files (if you have them)
    # IMPORTANT: The alias path now points to /home/media/ inside the Nginx container,
    # which is where the media_volume_prod is mounted.
    location /media/ {
        alias /home/media/;
        expires 30d;                  # Cache media files for 30 days
        access_log off;
        log_not_found off;
    }

    # Proxy all other requests to the Django admin application
    location / {
        proxy_pass http://admin_app;                  # Forward requests to the admin_app upstream
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Preserve client IP
        proxy_set_header Host $host;                  # Pass the original Host header
        proxy_redirect off;                           # Don't rewrite redirects from the backend
        proxy_connect_timeout 60s;                    # Connection timeout
        proxy_send_timeout 60s;                       # Send timeout
        proxy_read_timeout 60s;                       # Read timeout
        send_timeout 60s;                             # Send timeout to client
    }
}
