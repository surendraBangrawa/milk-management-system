# Nginx configuration for digidairy.site (admin and API subdomains)

events {
    worker_connections 1024;
}

http {
    # Upstream for Django Admin
    upstream admin_app {
        server admin:1002;
    }

    # Upstream for FastAPI Backend
    upstream backend_api {
        server backend:8000;
    }

    # =============================
    # Admin Panel: admin.digidairy.site
    # =============================
    server {
        listen 80;
        server_name admin.digidairy.site;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl http2;
        server_name admin.digidairy.site;
        # SSL certificate paths (to be filled by Certbot)
        ssl_certificate /etc/letsencrypt/live/admin.digidairy.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.digidairy.site/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Static files (admin only)
        location /static/ {
            alias /home/static/;
            expires 30d;
            access_log off;
            log_not_found off;
            add_header Cache-Control "public, immutable";
        }
        # Media files (admin only)
        location /media/ {
            alias /home/media/;
            expires 30d;
            access_log off;
            log_not_found off;
            add_header Cache-Control "public, immutable";
        }
        # Admin panel root
        location / {
            proxy_pass http://admin_app;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            send_timeout 60s;
        }
    }

    # =============================
    # API: api.digidairy.site
    # =============================
    server {
        listen 80;
        server_name api.digidairy.site;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl http2;
        server_name api.digidairy.site;
        # SSL certificate paths (to be filled by Certbot)
        ssl_certificate /etc/letsencrypt/live/api.digidairy.site/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.digidairy.site/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # API root
        location / {
            proxy_pass http://backend_api;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            send_timeout 60s;
            # CORS headers for API
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }
        }
    }
}
