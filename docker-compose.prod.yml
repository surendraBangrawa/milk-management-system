services:
  db:
    image: mysql:8.0
    container_name: milk_db_prod
    env_file:
      - ./.env.prod
    volumes:
      - db_data_prod:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: milk_backend_prod
    ports:
      - "8000:8000"
    env_file:
      - ./.env.prod
    depends_on:
      db:
        condition: service_healthy
    restart: always

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.prod
      args:
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_HOST: db # Use the service name as the host
        DB_PORT: 3306 # Default MySQL port
        DB_NAME: ${DB_NAME}
    container_name: milk_admin_prod
    env_file:
      - ./.env.prod
    ports:
      - "1002:1002"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - static_volume_prod:/app/static_collected # Unique volume for prod static files
      - media_volume_prod:/app/media_collected # Unique volume for prod media files
    restart: always
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn Admin_M.wsgi:application --bind 0.0.0.0:1002"

volumes:
  db_data_prod:
  static_volume_prod:
  media_volume_prod:
