# docker-compose.prod.yml
version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: milk_db_prod
    # Environment variables will be loaded from .env.production
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data_prod:/var/lib/mysql # Separate volume for production
    ports:
      - "3306:3306" # Only expose if truly needed externally, otherwise use internal networking
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile # Assuming a single Dockerfile for backend
    container_name: milk_backend_prod
    ports:
      - "8000:8000"
    # Environment variables will be loaded from .env.production
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_NAME: ${DB_NAME}
      DB_PORT: 3306
      SECRET_KEY: ${FASTAPI_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      TZ: ${TZ}
    depends_on:
      db:
        condition: service_healthy
    # For production, you typically don't mount host volumes directly,
    # but build the image with the code baked in.
    # volumes:
    #   - ./backend:/app # Remove this line for production
    restart: always

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.prod # Using Dockerfile.prod for production
    container_name: milk_admin_prod
    ports:
      - "1002:1002"
    # Environment variables will be loaded from .env.production
    environment:
      DJANGO_SETTINGS_MODULE: Admin_M.settings
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}
      FASTAPI_API: http://backend:8000
      SECRET_KEY: ${DJANGO_SECRET_KEY}
      DEBUG: ${DEBUG} # Controlled by .env.production
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      CORS_ORIGIN_WHITELIST: ${CORS_ORIGIN_WHITELIST}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      # For production, you typically don't mount host volumes directly for code,
      # but volumes for collected static/media files are good.
      # - ./admin:/app # Remove this line for production code
      - static_volume_prod:/app/static_collected # Unique volume for prod static files
      - media_volume_prod:/app/media_collected # Unique volume for prod media files
    restart: always
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn Admin_M.wsgi:application --bind 0.0.0.0:1002"

volumes:
  db_data_prod: # Unique volume for production database data
  static_volume_prod: # Unique volume for production static files
  media_volume_prod: # Unique volume for production media files
