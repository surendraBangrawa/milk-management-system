services:
  db:
    image: mysql:8.0
    container_name: milk_db_prod
    env_file:
      - ./.env.prod
    volumes:
      - db_data_prod:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: milk_redis_prod
    ports:
      - "6379:6379"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: milk_backend_prod
    ports:
      - "8000:8000"
    env_file:
      - ./.env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: milk_celery_worker_prod
    env_file:
      - ./.env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    command: celery -A app.celery_app worker --loglevel=info --queues=ratelist

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.prod
    container_name: milk_admin_prod
    ports:
      - "1002:1002"
    env_file:
      - ./.env.prod
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./admin:/app
      - static_volume_prod:/app/static_collected
      - media_volume_prod:/app/media_collected
    restart: always
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn Admin_M.wsgi:application --bind 0.0.0.0:1002"

volumes:
  db_data_prod:
  static_volume_prod:
  media_volume_prod:
