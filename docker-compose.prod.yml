services:
  db:
    image: mysql:8.0
    container_name: milk_db_prod
    env_file:
      - ./.env.prod
    volumes:
      - db_data_prod:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: milk_redis_prod
    ports:
      - "6379:6379"
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: milk_backend_prod
    ports:
      - "8000:8000"
    env_file:
      - ./.env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: milk_celery_worker_prod
    env_file:
      - ./.env.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    command: celery -A app.celery_app worker --loglevel=info --queues=ratelist

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.prod
    container_name: milk_admin_prod
    env_file:
      - ./.env.prod
    # REMOVED: No longer need to expose ports directly from admin, Nginx will proxy to it
    # ports:
    #   - "1002:1002"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      # Updated volume mount for static files to /home/static as per your setup
      - static_volume_prod:/home/static
      # Updated volume mount for media files for consistency, assuming they follow a similar structure
      - media_volume_prod:/home/media
    restart: always
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn Admin_M.wsgi:application --bind 0.0.0.0:1002"

  # NEW SERVICE: Nginx reverse proxy and static file server
  nginx:
    image: nginx:latest # Use the official Nginx image
    container_name: milk_nginx_prod
    ports:
      - "80:80" # Map host port 80 to Nginx's port 80 (standard HTTP)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro # Mount the Nginx configuration
      - static_volume_prod:/home/static:ro # Mount static files for serving
      - media_volume_prod:/home/media:ro # Mount media files for serving
    depends_on:
      - admin # Nginx depends on the admin app being ready
    restart: always

volumes:
  db_data_prod:
  static_volume_prod:
  media_volume_prod:
