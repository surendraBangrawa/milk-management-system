services:
  db:
    image: mysql:8.0
    container_name: milk_db_prod
    env_file:
      - ./.env.prod
    volumes:
      - db_data_prod:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: milk_backend_prod
    ports:
      - "8000:8000"
    env_file:
      - ./.env.prod
    depends_on:
      db:
        condition: service_healthy
    restart: always

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.prod
    container_name: milk_admin_prod
    env_file:
      - ./.env.prod
    # REMOVED: No longer need to expose ports directly from admin, Nginx will proxy to it
    # ports:
    #   - "1002:1002"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      # Updated volume mount for static files to /home/static as per your setup
      - static_volume_prod:/home/static
      # Updated volume mount for media files for consistency, assuming they follow a similar structure
      - media_volume_prod:/home/media
    restart: always
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn Admin_M.wsgi:application --bind 0.0.0.0:1002"

  # NEW SERVICE: Nginx reverse proxy and static file server
  nginx:
    image: nginx:latest # Use the official Nginx image
    container_name: milk_nginx_prod
    ports:
      - "80:80" # Map host port 80 to Nginx's port 80 (standard HTTP)
    volumes:
      # Mount the Nginx config file
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount the static and media volumes (read-only for Nginx)
      # Ensure Nginx accesses static files from /home/static
      - static_volume_prod:/home/static:ro
      - media_volume_prod:/home/media:ro
    depends_on:
      admin:
        condition: service_started # Ensure admin app is running before Nginx starts
    restart: always

volumes:
  db_data_prod:
  static_volume_prod:
  media_volume_prod:
