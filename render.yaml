services:
  # FastAPI Backend
  - type: web
    name: milk-management-api
    env: docker
    dockerfilePath: ./backend/Dockerfile.prod
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FAST2SMS_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false

  # Celery Background Worker
  - type: worker
    name: milk-management-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile.prod
    command: celery -A app.celery_app worker --loglevel=info --queues=ratelist
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
