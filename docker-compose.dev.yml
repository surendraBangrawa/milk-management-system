services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: milk-backend-dev
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=mysql+pymysql://milk_user:milk_password@db:3306/milk_management
      - REDIS_URL=redis://redis:6379
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_demo}
      - RAZORPAY_SECRET_KEY=${RAZORPAY_SECRET_KEY:-demo_secret}
      - SECRET_KEY=${JWT_SECRET_KEY:-dev_jwt_secret_key}
      - DB_USER=milk_user
      - DB_PASSWORD=milk_password
      - DB_HOST=db
      - DB_NAME=milk_management
      - DB_PORT=3306
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8081,http://localhost:19006
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    depends_on:
      - db
      - redis
    networks:
      - milk-network
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Admin Django Service
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    container_name: milk-admin-dev
    ports:
      - "8001:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=mysql+pymysql://milk_user:milk_password@db:3306/milk_management
      - SECRET_KEY=${DJANGO_SECRET_KEY:-dev_django_secret}
      - ALLOWED_HOSTS=localhost,127.0.0.1
    volumes:
      - ./admin:/app
      - admin_logs:/app/logs
    depends_on:
      - db
    networks:
      - milk-network
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: milk-db-dev
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=milk_management
      - MYSQL_USER=milk_user
      - MYSQL_PASSWORD=milk_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - milk-network
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: milk-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - milk-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: milk-nginx-dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - admin
    networks:
      - milk-network
    restart: unless-stopped

  # Mailhog for Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: milk-mailhog-dev
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - milk-network
    restart: unless-stopped

  # Adminer for Database Management
  adminer:
    image: adminer:latest
    container_name: milk-adminer-dev
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=db
    depends_on:
      - db
    networks:
      - milk-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  backend_logs:
  admin_logs:

networks:
  milk-network:
    driver: bridge
