services:
  # ==================== DATABASE ====================

  postgres:
    image: postgres:17
    container_name: milk_postgres_dev
    env_file:
      - .env.dev
    environment:
      # PostgreSQL requires POSTGRES_PASSWORD, map from DB_PASSWORD
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_DB=${DB_NAME:-milk_management}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - milk_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=postgres,env=dev"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== REDIS ====================

  redis:
    image: redis/redis-stack:7.2.0-v18
    container_name: milk_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8002:8001"
    volumes:
      - redis_data_dev:/data
    env_file:
      - .env.dev
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:-}",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--protected-mode",
        "no",
      ]
    networks:
      - milk_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=redis,env=dev"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==================== BACKEND API ====================

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: milk_backend_dev
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-milk_management}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - milk_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=backend,env=dev"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ==================== CELERY WORKER ====================

  celery_worker:
    build:
      context: .
      dockerfile: worker/Dockerfile.dev
    container_name: milk_celery_worker_dev
    env_file:
      - .env.dev
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-milk_management}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend/app:/app/app
      - celery_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - milk_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=celery,env=dev"

  # ==================== ADMIN PANEL ====================

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    container_name: milk_admin_dev
    ports:
      - "1002:1002"
    env_file:
      - .env.dev
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
    volumes:
      - ./admin:/app
      - admin_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - milk_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=admin,env=dev"

  # ==================== WEBSITE ====================

  website:
    build:
      context: ./website
      dockerfile: Dockerfile.dev
    container_name: milk_website_dev
    ports:
      - "3000:3000"
    env_file:
      - .env.dev
    environment:
      - NODE_ENV=development
    volumes:
      - ./website:/app
      - /app/node_modules
      - /app/.next
      - website_logs:/app/logs
    networks:
      - milk_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=website,env=dev"

  # ==================== NGINX PROXY MANAGER ====================

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: milk_npm_dev
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data_dev:/data
      - npm_letsencrypt_dev:/etc/letsencrypt
      - npm_logs:/var/log/nginx
    env_file:
      - .env.dev
    networks:
      - milk_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=nginx-proxy-manager,env=dev"

  # ==================== LOGGING STACK ====================

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:3.4.1
    container_name: milk_loki_dev
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki.dev.yml:/etc/loki/local-config.yaml:ro
      - loki_data_dev:/loki
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    networks:
      - milk_network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3100/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Promtail - Log Collector
  promtail:
    image: grafana/promtail:3.4.1
    container_name: milk_promtail_dev
    volumes:
      - ./promtail/promtail.dev.yml:/etc/promtail/config.yml:ro
      - backend_logs:/var/log/backend:ro
      - admin_logs:/var/log/admin:ro
      - website_logs:/var/log/website:ro
      - celery_logs:/var/log/celery:ro
      - npm_logs:/var/log/nginx:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - milk_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:11.4.0
    container_name: milk_grafana_dev
    ports:
      - "3001:3000"
    env_file:
      - .env.dev
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_data_dev:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - milk_network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  postgres_data_dev:
  redis_data_dev:
  loki_data_dev:
  grafana_data_dev:
  backend_logs:
  admin_logs:
  website_logs:
  celery_logs:
  npm_logs:
  npm_data_dev:
  npm_letsencrypt_dev:

networks:
  milk_network:
    driver: bridge
