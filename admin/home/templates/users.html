<script nonce="{{ nonceValue }}">
  const loadingSpinner = document.getElementById("loading-spinner");
  const overlay = document.getElementById("overlay");
  window.addEventListener("unload", function (event) {
    hideOverlay();
  });
</script>
<script nonce="{{ nonceValue }}">
  $(document).ready(function () {
    var csrfToken = document
      .querySelector('meta[name="csrf-token"]')
      .getAttribute("content");
    $.ajaxSetup({
      beforeSend: function (xhr, settings) {
        if (
          !/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type) &&
          !this.crossDomain
        ) {
          xhr.setRequestHeader("X-CSRFToken", csrfToken);
        }
      },
    });
    const dataTable = $("#dashboard").DataTable({
      scrollY: "58vh",
      scrollCollapse: true,
      bFilter: true,
      scrollX: true,
      bInfo: true,
      paging: true,
      bPaginate: true,
      pageLength: 25,
      lengthMenu: [[25], [25]],
      order: [],
      columnDefs: [{ orderable: false, targets: "_all" }],
      serverSide: true,
      processing: true,
      stateSave: true,
      ajax: {
        url: "/api/user",
        type: "GET",
        data: function (data) {
          delete data.columns;
          // delete data.search;
          delete data.draw;
        },
        error: function (xhr, error, thrown) {
          console.log(error);
          $("#dashboard tbody").html(
            '<tr><td colspan="3" class="error-message">Something went wrong. Please try again later</td></tr>'
          );
          $(".dataTables_processing").hide();
        },
        dataSrc: function (response) {
          return response.data;
        },
      },
      columns: [
        {
          data: "name",
          className: "md dot",
          render: function (data, type, row) {
            return data ? data : "-";
          },
        },
        {
          data: "mobile",
          className: "sm dot",
          render: function (data, type, row) {
            return data ? data : "-";
          },
        },
        {
          data: "customer_count",
          className: "sm dot text-center",
          render: function (data, type, row) {
            if (data && data > 0) {
              return `<div class="d-flex justify-content-center"><a href="/customers/${row.mobile}" class="customer-link">${data}</a></div>`;
            }
            return "-";
          },
        },
        {
          data: "registered_at",
          className: "md dot",
          render: function (data, type, row) {
            return data ? data : "-";
          },
        },
        {
          data: "is_deleted",
          className: "sm dot text-center",
          render: function (data, type, row) {
            if (!data) {
              return `<span class="status-active">True</span>`;
            } else {
              return `<span class="status-inactive">False</span>`;
            }
          },
        },
        {
          data: "is_deleted",
          className: "sm dot text-center",
          render: function (data, type, row) {
            if (data) {
              return `<button class="btn btn-success btn-sm clickable unblock" data-user-id="${row.mobile}" data-bs-toggle="tooltip" data-bs-placement="right" title="Unblock User">Unblock User</button>`;
            } else {
              return `<button class="btn btn-danger btn-sm clickable block" data-user-id="${row.mobile}" data-bs-toggle="tooltip" data-bs-placement="right" title="Block User">Block User</button>`;
            }
          },
        },
      ],
    });
  });
</script>

<style nonce="{{ nonceValue }}">
  .error-message {
    text-align: center;
  }
</style>
<script nonce="{{ nonceValue }}">
  if (window.history.replaceState) {
    window.history.replaceState(null, null, window.location.href);
  }
</script>

<script nonce="{{ nonceValue }}">
  $(document).on("click", ".block", function (event) {
    var ctId1 = $(this).data("user-id");
    $("#approveModal").data("user-id", ctId1);
    $("#approveModal").modal("show");
  });
  $("#approveBlock").click(function () {
    var mobile = $("#approveModal").data("user-id");
    showOverlay();
    $.ajax({
      url: "/api/user/",
      type: "PATCH",
      data: { mobile: mobile, is_deleted: 1 },
      success: function (response) {
        $("#dashboard")
          .DataTable()
          .ajax.reload(function (json) {
            if (!json || !json.records || json.records.length === 0) {
              var table = $("#dashboard").DataTable();
              var pageInfo = table.page.info();
              if (pageInfo.page > 0) {
                table.page("previous").draw("page");
              }
            }
          }, false); // Stay on the current page after reload
        if (response) {
          $("#user-popup2 .bk").text(mobile);
        }
        $("#user-popup2").modal("show");
      },
      error: function (xhr) {
        var errorMessage =
          xhr.responseJSON && xhr.responseJSON.message
            ? xhr.responseJSON.message
            : "An error occurred";
        $("#errorModalBody").text(errorMessage);
        $("#errorModal").modal("show");
      },
    }).always(function () {
      hideOverlay();
    });
  });
</script>
